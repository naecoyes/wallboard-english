<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f3ed">
<title>EchoEnglish · 每日英语教练</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
  // 首帧前就定好白天/夜间主题，避免闪一下（逻辑与 js/theme.js 一致）
  (function () {
    var s = {};
    try { s = (JSON.parse(localStorage.getItem('wallboard-en-v1')) || {}).settings || {}; } catch (e) {}
    var forced = new URLSearchParams(location.search).get('theme');
    var mode = forced === 'light' || forced === 'dark' ? forced : (s.theme || 'auto'), t;
    if (mode === 'light' || mode === 'dark') t = mode;
    else if (mode === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    else { var d = new Date(), h = d.getHours() + d.getMinutes() / 60; t = h >= (s.dayStart ?? 7) && h < (s.dayEnd ?? 19) ? 'light' : 'dark'; }
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a id="brand" href="#standby" style="text-decoration:none;color:inherit">
      <span class="logo">E.</span>
      <span class="brand-text"><b>EchoEnglish</b><small>YOUR DAILY ENGLISH COACH</small></span>
    </a>
    <nav class="nav-wrap">
      <div class="seg">
        <a href="#standby" data-nav="standby" data-icon="home"><span>今日</span></a>
        <a href="#word" data-nav="word" data-icon="book"><span>单词</span></a>
        <a href="#micro" data-nav="micro" data-icon="zap"><span>碎片 5′</span></a>
        <a href="#focus" data-nav="focus" data-icon="target"><span>专注 25′</span></a>
      </div>
      <a class="nav-icon" href="#settings" data-nav="settings" data-icon="settings" aria-label="设置"></a>
    </nav>
  </header>
  <main id="screen"><!-- 各模式渲染到这里 --></main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
