<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f3ed">
<title>WallBoard English</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-book-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-book-192.png">
<link rel="shortcut icon" href="icons/favicon-book.ico">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
  // 首帧前就定好白天/夜间主题，避免闪一下（逻辑与 js/theme.js 一致）
  (function () {
    var s = {};
    try { s = (JSON.parse(localStorage.getItem('wallboard-en-v1')) || {}).settings || {}; } catch (e) {}
    var forced = new URLSearchParams(location.search).get('theme');
    var mode = forced === 'light' || forced === 'dark' ? forced : (s.theme || 'auto'), t;
    if (mode === 'light' || mode === 'dark') t = mode;
    else if (mode === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    else { var d = new Date(), h = d.getHours() + d.getMinutes() / 60; t = h >= (s.dayStart ?? 7) && h < (s.dayEnd ?? 19) ? 'light' : 'dark'; }
    document.documentElement.dataset.theme = t;
    var pal = new URLSearchParams(location.search).get('palette') || s.palette || 'forest';
    if (!/^(forest|ocean|terracotta|lavender|rose|graphite)$/.test(pal)) pal = 'forest';
    document.documentElement.dataset.palette = pal;
  })();
</script>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a id="brand" href="#standby" style="text-decoration:none;color:inherit">
      <span class="logo">W</span>
      <span class="brand-text"><b>WallBoard English</b><small>ENGLISH ON YOUR WALL</small></span>
    </a>
    <nav class="nav-wrap">
      <div class="seg">
        <a href="#standby" data-nav="standby" data-icon="home"><span>Today</span></a>
        <a href="#word" data-nav="word" data-icon="book"><span>Words</span></a>
        <a href="#sentences" data-nav="sentences" data-icon="chat"><span>Sentences</span></a>
        <a href="#reading" data-nav="reading" data-icon="article"><span>Reading</span></a>
        <a href="#micro" data-nav="micro" data-icon="zap"><span>Quick 5′</span></a>
        <a href="#focus" data-nav="focus" data-icon="target"><span>Focus 25′</span></a>
      </div>
      <button class="nav-icon" id="fullscreen-btn" type="button" aria-label="Enter fullscreen" title="Enter fullscreen" aria-pressed="false"></button>
      <a class="nav-icon" href="#settings" data-nav="settings" data-icon="settings" aria-label="Settings"></a>
    </nav>
  </header>
  <main id="screen"><!-- 各模式渲染到这里 --></main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
